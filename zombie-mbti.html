<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>좀비 아포칼립스 MBTI · 당신의 생존 유형은?</title>
<meta property="og:title" content="좀비 사태가 터졌다. 당신은 며칠 버틸까? — 생존 MBTI">
<meta property="og:description" content="8개의 선택으로 알아보는 나의 생존 유형과 생존 확률!">
<style>
  :root{
    --bg:#0b0f0c; --panel:#121813; --ink:#e7f0e8; --muted:#8fa393;
    --line:#243026; --brand:#3fae54; --danger:#e0442e; --warn:#e8b73a;
    --shadow:0 12px 48px rgba(0,0,0,.6); --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,
      "Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(900px 500px at 50% -5%, #16241a, var(--bg)) fixed;
    color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px 16px;
  }
  .stage{width:100%; max-width:600px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden; position:relative;
  }

  .pad{padding:40px 34px}
  .eyebrow{color:var(--danger); font-weight:800; letter-spacing:.2em; font-size:12.5px;
    text-align:center; margin-bottom:16px}
  .biohazard{
    width:96px;height:96px;margin:6px auto 20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:48px;
    background:radial-gradient(circle at 50% 40%, #1c2b1f, #0c130e);
    border:3px solid var(--danger); box-shadow:0 0 32px rgba(224,68,46,.35);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 24px rgba(224,68,46,.25)}50%{box-shadow:0 0 40px rgba(224,68,46,.5)}}
  h1{font-size:29px; text-align:center; margin:0 0 8px; line-height:1.32; letter-spacing:-.01em}
  h1 .em{color:var(--danger)}
  .sub{text-align:center; color:var(--muted); font-size:15px; margin:0 0 28px}
  .btn{
    display:block; width:100%; padding:16px; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--danger),#b5321f); color:#fff;
    font-family:inherit; font-size:17px; font-weight:800; border-radius:14px;
    letter-spacing:.02em; transition:transform .1s, filter .15s;
    box-shadow:0 8px 22px rgba(224,68,46,.3);
  }
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
  .btn.green{background:linear-gradient(135deg,var(--brand),#2c8540); box-shadow:0 8px 22px rgba(63,174,84,.3)}
  .btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line);
    box-shadow:none; font-size:15px; padding:13px}
  .meta-row{display:flex; gap:12px; justify-content:center; color:var(--muted);
    font-size:13px; margin-top:18px; flex-wrap:wrap}

  .prog-wrap{padding:22px 34px 0}
  .prog-top{display:flex; justify-content:space-between; color:var(--muted); font-size:12.5px; margin-bottom:10px; letter-spacing:.03em}
  .prog{height:7px; background:var(--line); border-radius:99px; overflow:hidden}
  .prog>i{display:block; height:100%; width:0;
    background:linear-gradient(90deg,var(--warn),var(--danger)); transition:width .35s}

  .q{padding:26px 34px 38px}
  .q .scene{color:var(--danger); font-size:12.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase}
  .q h2{font-size:21px; line-height:1.5; margin:8px 0 24px; min-height:64px}
  .opt{
    display:block; width:100%; text-align:left; padding:17px 18px; margin-bottom:12px;
    background:#0e150f; border:1.5px solid var(--line); border-radius:13px;
    color:var(--ink); font-family:inherit; font-size:16px; cursor:pointer;
    transition:border .15s, transform .1s, background .15s;
  }
  .opt:hover{border-color:var(--danger); background:#14201a}
  .opt:active{transform:scale(.99)}

  .res{text-align:center}
  .res-hero{padding:34px 30px 26px; background:linear-gradient(160deg,#0c130e,#16241a);
    border-bottom:1px solid var(--line)}
  .res-emoji{font-size:64px; line-height:1; margin-bottom:8px}
  .res-type{font-size:13px; letter-spacing:.22em; color:var(--muted); font-weight:800}
  .res-title{font-size:31px; font-weight:900; margin:6px 0 4px}
  .res-tagline{font-size:15.5px; color:var(--muted); margin:0}
  .survival{padding:22px 32px 6px}
  .survival .slbl{font-size:13px; color:var(--muted); margin-bottom:8px; letter-spacing:.04em}
  .bar{height:16px; background:#0e150f; border:1px solid var(--line); border-radius:99px; overflow:hidden; position:relative}
  .bar>i{display:block; height:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--danger),var(--warn) 55%,var(--brand)); width:0; transition:width 1s ease-out}
  .pct{font-size:34px; font-weight:900; margin-top:12px}
  .res-body{padding:20px 32px 6px; text-align:left}
  .res-body .quote{border-left:3px solid var(--danger); padding:4px 0 4px 15px; color:#f2b8ae; font-style:italic; font-size:15.5px; margin:0 0 16px}
  .res-body p{font-size:15px; margin:0 0 16px}
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:6px 32px 8px}
  .stat{background:#0e150f; border:1px solid var(--line); border-radius:12px; padding:12px 14px}
  .stat .k{font-size:12px; color:var(--muted); margin-bottom:3px}
  .stat .v{font-size:15px; font-weight:800}
  .stat .v.g{color:var(--brand)} .stat .v.r{color:var(--danger)}
  .traits{display:flex; flex-wrap:wrap; gap:8px; padding:14px 32px 4px}
  .trait{background:#16241a; color:var(--brand); border:1px solid var(--line);
    border-radius:99px; padding:6px 13px; font-size:13px; font-weight:700}
  .share{padding:22px 32px 0; display:grid; gap:10px}
  .foot{text-align:center; color:var(--muted); font-size:12px; margin:22px 0 30px}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:#000; color:#fff; padding:12px 20px; border-radius:99px; font-size:14px;
    opacity:0; transition:.25s; pointer-events:none; z-index:9; border:1px solid var(--line)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .hidden{display:none}
  @media (max-width:480px){
    .pad{padding:32px 22px} .q{padding:22px 22px 30px} h1{font-size:25px}
    .res-body,.survival,.stats,.traits,.share{padding-left:22px; padding-right:22px}
  }
</style>
</head>
<body>
<div class="stage">

  <!-- INTRO -->
  <section class="card" id="intro">
    <div class="pad">
      <div class="eyebrow">⚠ EMERGENCY BROADCAST ⚠</div>
      <div class="biohazard">☣️</div>
      <h1>좀비 사태가 터졌다.<br>당신은 <span class="em">며칠</span> 버틸까?</h1>
      <p class="sub">8개의 선택으로 알아보는 나의 생존 유형과 생존 확률</p>
      <button class="btn" id="startBtn">생존 테스트 시작</button>
      <div class="meta-row">
        <span>⏱ 1분</span><span>·</span><span>🧟 16가지 생존 유형</span><span>·</span><span>📊 생존율 계산</span>
      </div>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="card hidden" id="quiz">
    <div class="prog-wrap">
      <div class="prog-top"><span id="qcount">DAY 1 / 8</span><span>SURVIVAL TEST</span></div>
      <div class="prog"><i id="progbar"></i></div>
    </div>
    <div class="q">
      <div class="scene" id="scene"></div>
      <h2 id="qtext"></h2>
      <div id="opts"></div>
    </div>
  </section>

  <!-- RESULT -->
  <section class="card hidden" id="result">
    <div class="res">
      <div class="res-hero">
        <div class="res-emoji" id="rEmoji">🧟</div>
        <div class="res-type" id="rType">ISTP</div>
        <div class="res-title" id="rTitle"></div>
        <p class="res-tagline" id="rTagline"></p>
      </div>
      <div class="survival">
        <div class="slbl">예상 생존 확률</div>
        <div class="bar"><i id="rBar"></i></div>
        <div class="pct" id="rPct">—</div>
      </div>
      <div class="res-body">
        <p class="quote" id="rQuote"></p>
        <p id="rDesc"></p>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">🗡️ 무기</div><div class="v" id="rWeapon"></div></div>
        <div class="stat"><div class="k">⚡ 최대 강점</div><div class="v g" id="rStrength"></div></div>
        <div class="stat"><div class="k">💀 최대 약점</div><div class="v r" id="rWeak"></div></div>
        <div class="stat"><div class="k">🤝 최고의 파트너</div><div class="v" id="rBuddy"></div></div>
      </div>
      <div class="traits" id="rTraits"></div>
      <div class="share">
        <button class="btn" id="copyBtn">🔗 결과 복사해서 친구 소환하기</button>
        <button class="btn ghost" id="retryBtn">다시 하기</button>
      </div>
      <div class="foot">캡처해서 스토리에 올리고 친구 생존율과 비교해보세요 · 생존 MBTI</div>
    </div>
  </section>

</div>
<div class="toast" id="toast">복사됐어요! 친구에게 붙여넣기 하세요</div>

    ENFJ:{e:"🤝",t:"모두를 뭉치게 하는 리더",tag:"흩어진 사람들을 하나로 만드는 구심점",pct:75,

    ENFP:{e:"🔥",t:"무리의 분위기 메이커",tag:"절망도 웃음으로 바꾸는 에너지원",pct:60,
      quote:"“살아있는 동안은 웃어야지!”",

  var idx=0, score={EI:0,SN:0,TF:0,JP:0};
  function render(){
    var item=Q[idx];
    $("#scene").textContent=item.scene;
    $("#qtext").textContent=item.q;
    $("#qcount").textContent="DAY "+(idx+1)+" / "+Q.length;
    $("#progbar").style.width=((idx)/Q.length*100)+"%";
    var box=$("#opts"); box.innerHTML="";
    item.a.forEach(function(text,i){
      var b=document.createElement("button");
      b.className="opt"; b.textContent=text;
      b.onclick=function(){ pick(item.axis, i===0); };
      box.appendChild(b);
    });
  }
  function pick(axis,isFirst){
    if(isFirst) score[axis]++; else score[axis]--;
    idx++;
    if(idx<Q.length) render(); else finish();
  }
  function finish(){
    var type=(score.EI>=0?"E":"I")+(score.SN>=0?"S":"N")+(score.TF>=0?"T":"F")+(score.JP>=0?"J":"P");
    var r=R[type];
    $("#progbar").style.width="100%";
    $("#rEmoji").textContent=r.e;
    $("#rType").textContent=type;
    $("#rTitle").textContent=r.t;
    $("#rTagline").textContent=r.tag;
    $("#rQuote").textContent=r.quote;
    $("#rDesc").textContent=r.desc;
    $("#rWeapon").textContent=r.weapon;
    $("#rStrength").textContent=r.strength;
    $("#rWeak").textContent=r.weak;
    $("#rBuddy").textContent=r.buddy;
    var tw=$("#rTraits"); tw.innerHTML="";
    r.traits.forEach(function(t){var s=document.createElement("span");s.className="trait";s.textContent=t;tw.appendChild(s);});
    show("#result");
    window.scrollTo(0,0);
    // animate survival
    var pct=r.pct;
    setTimeout(function(){ $("#rBar").style.width=pct+"%"; },120);
    var cur=0; var iv=setInterval(function(){ cur+=2; if(cur>=pct){cur=pct;clearInterval(iv);} $("#rPct").textContent="생존율 "+cur+"%"; },18);
    try{ location.hash=type; }catch(e){}
  }
  function show(sel){
    ["#intro","#quiz","#result"].forEach(function(s){ $(s).classList.add("hidden"); });
    $(sel).classList.remove("hidden");
  }
  $("#startBtn").onclick=function(){ idx=0; score={EI:0,SN:0,TF:0,JP:0}; render(); show("#quiz"); };
  $("#retryBtn").onclick=function(){ idx=0; score={EI:0,SN:0,TF:0,JP:0}; try{location.hash="";}catch(e){} show("#intro"); };
  $("#copyBtn").onclick=function(){
    var t=$("#rTitle").textContent, p=$("#rPct").textContent;
    var msg="좀비 사태 터짐. 내 생존 유형은 ["+t+"] ("+p+")! 너는 며칠 버티나 해봐 👉 "+location.href;
    var done=function(){ var el=$("#toast"); el.classList.add("show"); setTimeout(function(){el.classList.remove("show");},2200); };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(msg).then(done,function(){ prompt("아래 내용을 복사하세요:",msg); });
    } else { prompt("아래 내용을 복사하세요:",msg); }
  };
})();
</script>
