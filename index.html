<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공부 타이머</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #a0a0d0;
      margin-bottom: 24px;
      letter-spacing: 2px;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 560px;
      margin-bottom: 24px;
    }

    .subject-btn {
      background: #1a1a2e;
      border: 2px solid #2a2a4a;
      border-radius: 12px;
      padding: 16px 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      user-select: none;
    }

    .subject-btn:hover {
      border-color: #5a5aaa;
      background: #22223a;
    }

    .subject-btn.active {
      border-color: #7a7aff;
      background: #1e1e4a;
      box-shadow: 0 0 12px #7a7aff44;
    }

    .subject-btn .name {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #c0c0f0;
    }

    .subject-btn.active .name {
      color: #9090ff;
    }

    .subject-btn .time {
      font-size: 0.85rem;
      color: #6a6a9a;
      font-variant-numeric: tabular-nums;
    }

    .subject-btn.active .time {
      color: #7070cc;
    }

    .timer-display {
      background: #1a1a2e;
      border: 2px solid #2a2a4a;
      border-radius: 16px;
      padding: 28px 40px;
      text-align: center;
      width: 100%;
      max-width: 560px;
      margin-bottom: 20px;
    }

    .current-subject {
      font-size: 0.9rem;
      color: #6a6a9a;
      margin-bottom: 8px;
      min-height: 1.2em;
    }

    .current-subject span {
      color: #9090ff;
      font-weight: 600;
    }

    .elapsed {
      font-size: 3rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 4px;
      color: #e0e0ff;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 18px;
    }

    .btn {
      padding: 10px 28px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-start {
      background: #5a5aff;
      color: #fff;
    }

    .btn-start:hover { background: #7070ff; }
    .btn-start:disabled { background: #3a3a6a; color: #6a6aaa; cursor: not-allowed; }

    .btn-stop {
      background: #ff5a7a;
      color: #fff;
    }

    .btn-stop:hover { background: #ff7090; }
    .btn-stop:disabled { background: #4a2a35; color: #7a4a5a; cursor: not-allowed; }

    .btn-reset {
      background: #2a2a4a;
      color: #9090bb;
    }

    .btn-reset:hover { background: #3a3a5a; }

    .log-section {
      width: 100%;
      max-width: 560px;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .log-header h2 {
      font-size: 0.95rem;
      color: #6a6aaa;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .btn-clear-log {
      font-size: 0.75rem;
      background: none;
      border: 1px solid #3a3a5a;
      color: #5a5a8a;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }

    .btn-clear-log:hover { border-color: #ff5a7a; color: #ff5a7a; }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .summary-item {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .summary-item .s-name {
      font-size: 0.75rem;
      color: #6a6a9a;
    }

    .summary-item .s-time {
      font-size: 0.9rem;
      font-weight: 700;
      color: #9090cc;
      font-variant-numeric: tabular-nums;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
    }

    .log-list::-webkit-scrollbar { width: 4px; }
    .log-list::-webkit-scrollbar-track { background: #1a1a2e; }
    .log-list::-webkit-scrollbar-thumb { background: #3a3a6a; border-radius: 2px; }

    .log-item {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
    }

    .log-item .log-subject { color: #9090ff; font-weight: 600; }
    .log-item .log-duration { color: #7070bb; font-variant-numeric: tabular-nums; }
    .log-item .log-time { color: #4a4a7a; font-size: 0.75rem; }

    .total-bar {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .total-bar .label { font-size: 0.85rem; color: #6a6a9a; }
    .total-bar .value { font-size: 1.1rem; font-weight: 700; color: #b0b0ff; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>📚 공부 타이머</h1>

  <div class="subject-grid" id="subjectGrid"></div>

  <div class="timer-display">
    <div class="current-subject" id="currentSubjectLabel">과목을 선택하세요</div>
    <div class="elapsed" id="elapsed">00:00:00</div>
    <div class="controls">
      <button class="btn btn-start" id="btnStart" disabled>시작</button>
      <button class="btn btn-stop" id="btnStop" disabled>정지</button>
      <button class="btn btn-reset" id="btnReset">초기화</button>
    </div>
  </div>

  <div class="log-section">
    <div class="log-header">
      <h2>오늘 기록</h2>
      <button class="btn-clear-log" id="btnClearLog">전체 삭제</button>
    </div>
    <div class="total-bar">
      <span class="label">총 공부 시간</span>
      <span class="value" id="totalTime">00:00:00</span>
    </div>
    <div class="summary" id="summaryGrid"></div>
    <div class="log-list" id="logList"></div>
  </div>

  <script>
    const SUBJECTS = ['경제', '민법', '감관법', '회계', '부원론', '실', '이', '법', '기타'];

    let state = {
      selected: null,
      running: false,
      startTs: null,
      elapsed: 0,
      tickInterval: null,
      logs: JSON.parse(localStorage.getItem('study_logs') || '[]'),
      accumulated: JSON.parse(localStorage.getItem('study_acc') || '{}'),
    };

    // ---- DOM refs ----
    const subjectGrid = document.getElementById('subjectGrid');
    const elapsedEl = document.getElementById('elapsed');
    const currentSubjectLabel = document.getElementById('currentSubjectLabel');
    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const btnReset = document.getElementById('btnReset');
    const totalTimeEl = document.getElementById('totalTime');
    const logListEl = document.getElementById('logList');
    const summaryGrid = document.getElementById('summaryGrid');

    function fmt(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function fmtTime(date) {
      return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }

    // ---- Render subjects ----
    function renderSubjects() {
      subjectGrid.innerHTML = '';
      SUBJECTS.forEach(name => {
        const btn = document.createElement('div');
        btn.className = 'subject-btn' + (state.selected === name ? ' active' : '');
        btn.innerHTML = `<div class="name">${name}</div><div class="time">${fmt(state.accumulated[name] || 0)}</div>`;
        btn.addEventListener('click', () => selectSubject(name));
        subjectGrid.appendChild(btn);
      });
    }

    function selectSubject(name) {
      if (state.running) return;
      state.selected = name;
      btnStart.disabled = false;
      currentSubjectLabel.innerHTML = `선택: <span>${name}</span>`;
      renderSubjects();
    }

    // ---- Timer controls ----
    btnStart.addEventListener('click', () => {
      if (!state.selected || state.running) return;
      state.running = true;
      state.startTs = Date.now() - state.elapsed * 1000;
      btnStart.disabled = true;
      btnStop.disabled = false;
      currentSubjectLabel.innerHTML = `공부 중: <span>${state.selected}</span>`;
      state.tickInterval = setInterval(tick, 1000);
    });

    btnStop.addEventListener('click', () => {
      if (!state.running) return;
      clearInterval(state.tickInterval);
      state.running = false;
      const duration = Math.floor((Date.now() - state.startTs) / 1000);
      if (duration > 0) {
        addLog(state.selected, duration);
        state.accumulated[state.selected] = (state.accumulated[state.selected] || 0) + duration;
        save();
      }
      state.elapsed = 0;
      elapsedEl.textContent = fmt(0);
      btnStart.disabled = false;
      btnStop.disabled = true;
      currentSubjectLabel.innerHTML = `선택: <span>${state.selected}</span>`;
      renderSubjects();
      renderLog();
    });

    btnReset.addEventListener('click', () => {
      if (state.running) {
        clearInterval(state.tickInterval);
        state.running = false;
      }
      state.elapsed = 0;
      elapsedEl.textContent = fmt(0);
      btnStart.disabled = !state.selected;
      btnStop.disabled = true;
      if (state.selected) currentSubjectLabel.innerHTML = `선택: <span>${state.selected}</span>`;
    });

    document.getElementById('btnClearLog').addEventListener('click', () => {
      if (!confirm('오늘 기록을 모두 삭제할까요?')) return;
      state.logs = [];
      state.accumulated = {};
      save();
      renderSubjects();
      renderLog();
    });

    function tick() {
      state.elapsed = Math.floor((Date.now() - state.startTs) / 1000);
      elapsedEl.textContent = fmt(state.elapsed);
    }

    // ---- Log ----
    function addLog(subject, duration) {
      state.logs.unshift({ subject, duration, at: new Date().toISOString() });
    }

    function save() {
      localStorage.setItem('study_logs', JSON.stringify(state.logs));
      localStorage.setItem('study_acc', JSON.stringify(state.accumulated));
    }

    function renderLog() {
      // total
      const total = Object.values(state.accumulated).reduce((a, b) => a + b, 0);
      totalTimeEl.textContent = fmt(total);

      // summary
      summaryGrid.innerHTML = '';
      SUBJECTS.forEach(name => {
        const sec = state.accumulated[name] || 0;
        if (sec === 0) return;
        const el = document.createElement('div');
        el.className = 'summary-item';
        el.innerHTML = `<div class="s-name">${name}</div><div class="s-time">${fmt(sec)}</div>`;
        summaryGrid.appendChild(el);
      });

      // log items
      logListEl.innerHTML = '';
      state.logs.forEach(log => {
        const el = document.createElement('div');
        el.className = 'log-item';
        el.innerHTML = `
          <span class="log-subject">${log.subject}</span>
          <span class="log-duration">${fmt(log.duration)}</span>
          <span class="log-time">${fmtTime(new Date(log.at))}</span>
        `;
        logListEl.appendChild(el);
      });
    }

    // ---- Init ----
    renderSubjects();
    renderLog();
  </script>
</body>
</html>
